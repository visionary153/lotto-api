name: Update lotto results

on:
  schedule:
    # 토요일 20:35(KST) 추첨 → 집계가 늦게 채워지므로 여러 번 확인 (cron은 UTC, 수 분 지연될 수 있음)
    - cron: '50 11 * * 6' # 토 20:50 KST
    - cron: '30 12 * * 6' # 토 21:30 KST
    - cron: '30 13 * * 6' # 토 22:30 KST
    - cron: '0 0 * * 0' # 일 09:00 KST — 1등 판매점 반영 확인
    - cron: '0 0 * * 1' # 월 09:00 KST — 예비
  workflow_dispatch:
    inputs:
      from:
        description: '이 회차부터 다시 수집 (비우면 증분)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch results
        run: node scripts/fetch.mjs ${{ inputs.from && format('--from {0}', inputs.from) || '' }}

      - name: Commit
        id: commit
        run: |
          if [ -z "$(git status --porcelain results stores)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(node -p "require('./results/latest.json').round")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results stores
          git commit -m "update ${latest}회 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
